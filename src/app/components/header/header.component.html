<header class="site-header" id="top">
  <a class="wordmark" href="#top" aria-label="Mohamed Atef, back to top"
    >MA<span class="wordmark-dot">.</span></a
  >
  <p class="header-note">
    FULL-STACK SOFTWARE DEVELOPER<br />ANGULAR · TYPESCRIPT · .NET
  </p>
  <nav aria-label="Main navigation">
    <a href="#work">WORK <span aria-hidden="true">↘</span></a>
    <a href="#about">ABOUT</a>
    <a class="resume-nav" [href]="contact.resume" target="_blank" rel="noopener"
      >CV <span aria-hidden="true">↗</span></a
    >
    <div class="connect-wrap">
      <button
        id="connect"
        type="button"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="connect-menu"
        (click)="menuOpen.set(!menuOpen())"
      >
        LET'S TALK <span aria-hidden="true">↗</span>
      </button>
      <div id="connect-menu" [hidden]="!menuOpen()">
        <a href="#contact" (click)="menuOpen.set(false)">Get in touch ↘</a>
        <a [href]="'mailto:' + contact.email">Email me ↗</a>
        <a [href]="contact.github" target="_blank" rel="noopener">GitHub ↗</a>
        <a [href]="contact.linkedin" target="_blank" rel="noopener"
          >LinkedIn ↗</a
        >
      </div>
    </div>
  </nav>
</header>
